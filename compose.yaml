# Local development for the backend: a disposable PostgreSQL server and the
# server image. Never point anything here at Neon. See backend/README.md.
#
#   docker compose up -d --build
#   docker compose down        # removes the containers and their data
name: momentum

services:
  # The store tests create a database each through "postgres"; migration-diff
  # needs the empty "momentum_dev".
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: momentum_dev
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 2s
      timeout: 5s
      retries: 15

  # The server does not use the database yet; T09 adds DATABASE_URL.
  server:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      PORT: "8080"
    ports:
      - "127.0.0.1:8080:8080"
