name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: format, test, vet, build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [core, tui]
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          cache-dependency-path: "**/go.sum"
          cache: true
      - name: Format
        run: test -z "$(gofmt -l .)"
      - name: Unit and isolated integration tests
        run: go test ./...
      - name: Race tests
        run: go test -race ./...
      - name: Vet
        run: go vet ./...
      - name: Linux amd64 build
        if: matrix.module == 'tui'
        run: GOOS=linux GOARCH=amd64 go build ./cmd/momentum
      - name: Linux arm64 build
        if: matrix.module == 'tui'
        run: GOOS=linux GOARCH=arm64 go build ./cmd/momentum
      - name: macOS amd64 build
        if: matrix.module == 'tui'
        run: GOOS=darwin GOARCH=amd64 go build ./cmd/momentum
      - name: macOS arm64 build
        if: matrix.module == 'tui'
        run: GOOS=darwin GOARCH=arm64 go build ./cmd/momentum

  backend:
    name: backend format, test, vet, image
    runs-on: ubuntu-latest
    # Disposable PostgreSQL for the store tests; never a Neon database.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      MOMENTUM_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: "**/go.sum"
          cache: true
      - name: Format
        run: test -z "$(gofmt -l .)"
      - name: Generated ent code is current
        run: go generate ./... && test -z "$(git status --porcelain .)"
      - name: Tests
        run: go test ./...
      - name: Race tests
        run: go test -race ./...
      - name: Vet
        run: go vet ./...
      - name: Container image
        working-directory: .
        run: docker build -f backend/Dockerfile .
