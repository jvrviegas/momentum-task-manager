version: 2

project_name: momentum

before:
  hooks:
    - go mod tidy

builds:
  - id: momentum
    main: ./cmd/momentum
    binary: momentum
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.Version={{ .Version }}

archives:
  - formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}_x86_64
      {{- else }}_{{ .Arch }}
      {{- end }}

checksum:
  name_template: checksums.txt

release:
  draft: false
  prerelease: auto

metadata:
  mod_timestamp: '{{ .CommitTimestamp }}'
